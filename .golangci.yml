version: "2"

linters:
  default: none
  enable:
    # golangci-lint 的标准核心检查集，关注明确的正确性问题。
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  exclusions:
    paths:
      - node_modules

formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    paths:
      - node_modules

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
